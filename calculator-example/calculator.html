<!DOCTYPE html>
<!--
  ============================================================
  CALCULATOR — calculator.html
  ============================================================
  This file is responsible for the STRUCTURE of the page.
  Think of it as the skeleton: it defines what elements exist
  on the screen, but not how they look (that's CSS) or how
  they behave (that's JavaScript).

  HOW THE THREE FILES CONNECT:
  ┌─────────────────┐     links to     ┌──────────────────┐
  │ calculator.html │ ──────────────▶  │ calculator.css   │
  │  (Structure)    │                  │   (Appearance)   │
  └────────┬────────┘                  └──────────────────┘
           │          links to
           └────────────────────────▶  ┌──────────────────┐
                                       │ calculator.js    │
                                       │  (Behaviour)     │
                                       └──────────────────┘
  ============================================================
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Makes the page look correct on mobile screens -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>

  <!--
    LINKING CSS:
    This line tells the browser to load our stylesheet.
    "rel" means relationship (it's a stylesheet).
    "href" is the path to the file — same folder, so just the filename.
  -->
  <link rel="stylesheet" href="calculator.css">
</head>
<body>

  <!--
    MAIN CONTAINER
    Everything lives inside this div.
    The class "calculator" is used by CSS to style the card/shell.
  -->
  <div class="calculator">

    <!--
      DISPLAY AREA
      Shows two things:
        1. .expression → the running history, e.g. "12 + 5 ="
        2. .result     → the main large number shown to the user

      The "id" attributes let JavaScript find these elements with:
        document.getElementById('expression')
        document.getElementById('result')
    -->
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result"     id="result">0</div>
    </div>

    <!--
      BUTTON GRID
      All buttons sit inside this div, which CSS lays out as a 4-column grid.

      Each button has:
        • class="btn"          → base button styles (size, shape, font)
        • class="util/num/op"  → color group (grey / dark / orange)
        • data-action="..."    → tells JS *what to do* when clicked
        • data-value="..."     → tells JS *which value* to use (e.g. which digit or operator)

      DATA ATTRIBUTES (data-*):
        HTML lets you store custom information on any element using
        attributes that start with "data-". JavaScript reads them via:
          element.dataset.action
          element.dataset.value
    -->
    <div class="buttons">

      <!-- ── ROW 1: Utility buttons + divide ── -->
      <!--
        BACKSPACE: deletes the last digit typed.
        The ⌫ symbol is a Unicode character (just a visual icon, not an image).
      -->
      <button class="btn util backspace" data-action="backspace">⌫</button>

      <!-- AC: All Clear — resets the calculator completely -->
      <button class="btn util" data-action="clear">AC</button>

      <!-- %: Converts the current number to a percentage (divides by 100) -->
      <button class="btn util" data-action="percent">%</button>

      <!-- DIVIDE operator — data-value tells JS which operator symbol to use -->
      <button class="btn op" data-action="operator" data-value="÷">÷</button>

      <!-- ── ROW 2: 7, 8, 9 + multiply ── -->
      <button class="btn num" data-action="digit" data-value="7">7</button>
      <button class="btn num" data-action="digit" data-value="8">8</button>
      <button class="btn num" data-action="digit" data-value="9">9</button>
      <button class="btn op"  data-action="operator" data-value="×">×</button>

      <!-- ── ROW 3: 4, 5, 6 + subtract ── -->
      <button class="btn num" data-action="digit" data-value="4">4</button>
      <button class="btn num" data-action="digit" data-value="5">5</button>
      <button class="btn num" data-action="digit" data-value="6">6</button>
      <button class="btn op"  data-action="operator" data-value="−">−</button>

      <!-- ── ROW 4: 1, 2, 3 + add ── -->
      <button class="btn num" data-action="digit" data-value="1">1</button>
      <button class="btn num" data-action="digit" data-value="2">2</button>
      <button class="btn num" data-action="digit" data-value="3">3</button>
      <button class="btn op"  data-action="operator" data-value="+">+</button>

      <!-- ── ROW 5: negate, 0, decimal, equals ── -->
      <!--
        NEGATE: flips the sign of the current number (+/-).
        No data-value needed — JS just flips whatever is currently displayed.
      -->
      <button class="btn num"      data-action="negate">+/−</button>

      <!--
        ZERO: "zero" class is only used in CSS to style it as a circle.
        Functionally it behaves exactly like any other digit button.
      -->
      <button class="btn num zero" data-action="digit" data-value="0">0</button>

      <!-- DECIMAL POINT: adds a "." to the current number -->
      <button class="btn num"      data-action="decimal">.</button>

      <!-- EQUALS: triggers the final calculation and shows the result -->
      <button class="btn op"       data-action="equals">=</button>

    </div><!-- end .buttons -->
  </div><!-- end .calculator -->

  <!--
    LINKING JAVASCRIPT:
    This <script> tag is placed at the BOTTOM of <body> on purpose.
    By the time the browser reaches this line, all the HTML elements
    above already exist in memory — so JavaScript can safely find
    and interact with them.

    If we put this in <head> instead, the buttons wouldn't exist yet
    when JS tried to attach click listeners to them.
  -->
  <script src="calculator.js"></script>

</body>
</html>
