<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">   
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>Favorites</title>
</head>
<body class="bg-dark">
    <div class="container w-50">
        <header class="d-flex justify-content-center my-2">
            <h1 class="text-light">Add your favorites</h1>
        </header>
        <main>
            <form id="favorite-form" class="d-grid">
                <input type="text" id="favorite-input" class="form-control my-2 border border-primary">
                <div id="btn-section2" class="d-flex my-2 text-light">
                    <template id="favoriteBtn-template">
                        <input type="radio" id="Movies" name="Categories" value="Movies" class="mx-2">
                        <label for="Movies"class="">Movies</label>
                    </template>
                </div>
                
                <div id="btn-section1" class="d-flex my-2">
                    <button id="add-favorite" class="btn btn-primary" type="submit ">Add favorite</button>
                    <button id="add-category" class="btn btn-primary mx-2" type="submit">Add category</button>
                </div>
            </form>

            <section id="favorites-list" class="mt-2">

                <template id="favoriteCard-template">
                    <aside class="category border border-secundary rounded px-1 py-1 my-3">
                        <h2 class="text-light border-bottom">
                            <span>Movies</span>                         
                            <i class="fa-solid fa-circle-minus text-danger" role="button"></i>
                        </h2>

                        <div id="fav-elements" class="d-flex flex-row">
                            
                            <template id="favElementList-template">
                                <div class="text-light border border-secundary p-2 mx-1 my-1">
                                    <span class="favElement">Playing it cool</span>
                                    <i class="fa-solid fa-circle-xmark" role="button"></i>
                                </div>
                            </template>

                        </div>
                    </aside>
                </template>

            </section>
        </main>
    </div>

    <script src="./ls-exercise3.commented.js"></script>
</body>
</html>
