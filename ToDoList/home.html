<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">   
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    
    <title>To DO List</title>
</head>
<body class="bg-dark">
    <div class="container w-50">
        <header class="">
            <h1 class="text-center text-light">ToDo List</h1>
        </header>
    <main>
        <form id="form-tarea" class="d-grid">
            <input 
            id="input-tarea"
            type="text"
            placeholder="Ingrese tarea"
            class="form-control my-2 border border-primary"
            >
            <button 
            id="submit-tarea"
            type="submit" 
            class="btn btn-primary border border-secundary mt-1">Submit</button>
        </form>
        <section id="lista-tareas" class="mt-3">
            <div class="tarea border border-primary alert alert-warning d-flex justify-content-between align-items-center">
                <p class="m-0 ">Tarea #1</p> 
                <h3 class="">
                    <i class="fa-solid fa-circle-check text-success" role="button"></i>
                    <i class="fa-solid fa-circle-minus text-danger" role="button"></i>
                </h3>
            </div>
        </section>
        
    </main>
    <footer>
        <script type="text/javascript" src="./app.js"></script>
    </footer>
</div>
</body>
</html>
