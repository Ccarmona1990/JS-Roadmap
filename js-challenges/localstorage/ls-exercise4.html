<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">   
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>Ahorrador de Gastos</title>
</head>
<body class="bg-dark">  
    <div class="container w-50">
        <h2 class="text-light text-center">Ahorrador de Gastos</h2>
        <form id="saver-form" class="d-grid ">
            <!-- Aviso de error: empieza oculto (d-none) y el JS lo muestra cuando el usuario escribe algo inválido -->
            <div id="mensaje-error" class="alert alert-danger d-none my-2" role="alert"></div>
            <input type="text" placeholder="Descripcion" id="descripcion" class="form-control my-2 border border-primary" required>
            <input type="number" min="0.01" step="0.01" placeholder="Monto" id="monto" class="form-control my-2 border border-primary" required>
            <button type="submit" id="submit-expense" class="btn btn-primary">Agregar</button>
        </form>
        <section id="container-display-expenses-area" class="text-light my-3">
            <div class="d-flex justify-content-between border-bottom">
                <h3>Descripcion</h3>
                <h3>Monto</h3>
            </div>
            <div id="area-muestra-gastos"></div>
            <div class="d-flex justify-content-between border-top">
                <h3>Total</h3>
                <h3 id="total-gastos" class="me-3">0</h3>
            </div>
        </section>
    </div>
    <script src="./ls-exercise4.mejorado.js"></script>    
</body>
</html>
